# Overlay: run Knowledge Hub against a real Postgres instead of PGLite.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
# The entrypoint applies migrations/*.sql (Better Auth schema) on start.

services:
  web:
    environment:
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD:-hub}@db:5432/knowledge_hub
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: knowledge_hub
    ports:
      # Bound to loopback: never publish Postgres on a public interface.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kh_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  kh_pg:
